<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Top Kong — арена</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%94%A8</text></svg>">
<style>
  :root {
    --panel: rgba(12, 15, 22, 0.86);
    --line: rgba(255, 255, 255, 0.12);
    --text: #dfe4ee;
    --dim: #8b93a5;
    --accent: #ffb347;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #05070c;
    color: var(--text);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }

  #view { display: block; width: 100%; height: 100%; }

  /* Слой интерфейса не ловит указатель: игра должна получать мышь везде,
     кроме самих виджетов, у которых pointer-events включён обратно. */
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--dim);
    text-shadow: 0 1px 3px #000;
    white-space: pre;
  }

  #hud b { color: var(--text); font-weight: 600; }

  #hint {
    position: absolute;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    color: var(--dim);
    font-size: 12px;
    text-align: center;
    text-shadow: 0 1px 3px #000;
    opacity: 0.85;
  }

  /* --- панель настроек --- */
  #tune {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: 8px;
    width: 288px;
    max-width: calc(100vw - 16px);
    max-height: calc(100% - 16px - env(safe-area-inset-top, 0px));
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    pointer-events: auto;
  }

  #tune.folded #tuneBody { display: none; }

  #tuneHead {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 11px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  #tuneHead .spacer { flex: 1; }

  #tuneHead .chev { color: var(--dim); }

  #tuneBody {
    overflow-y: auto;
    padding: 0 11px 11px;
    -webkit-overflow-scrolling: touch;
  }

  .grp {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .row { margin: 7px 0; }

  .row .lbl {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 2px;
  }

  .row .lbl span:last-child { color: var(--text); }

  .row input[type=range] {
    width: 100%;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    background: transparent;
  }

  .row.check label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
  }

  .row.check input { accent-color: var(--accent); }

  .btns { display: flex; gap: 6px; margin-top: 12px; }

  .btns button {
    flex: 1;
    padding: 7px 4px;
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .btns button:hover { background: rgba(255, 255, 255, 0.14); }

  /* --- тач-управление: появляется только на устройствах без мыши --- */
  #touch { display: none; }

  body.touch #touch { display: block; }
  body.touch #hint { display: none; }

  #stick, #swing {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    border-radius: 50%;
    pointer-events: auto;
  }

  #stick {
    left: 24px;
    width: 132px;
    height: 132px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
  }

  #stickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 54px;
    margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    pointer-events: none;
  }

  #swing {
    right: 24px;
    width: 108px;
    height: 108px;
    border: 1px solid rgba(255, 179, 71, 0.5);
    background: rgba(255, 179, 71, 0.14);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  #swing.on { background: rgba(255, 179, 71, 0.38); }

  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070c;
    color: var(--dim);
    z-index: 10;
  }

  #boot.gone { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="ui">
  <div id="hud"></div>
  <div id="hint">WASD / стрелки — ход · мышь — прицел · ЛКМ зажать — замах, отпустить — удар · R — сброс</div>

  <div id="tune" class="folded">
    <div id="tuneHead"><span>Настройки</span><span class="spacer"></span><span class="chev">▾</span></div>
    <div id="tuneBody"></div>
  </div>

  <div id="touch">
    <div id="stick"><div id="stickKnob"></div></div>
    <div id="swing">УДАР</div>
  </div>
</div>

<div id="boot">загрузка…</div>

<!--
  Номер сборки и карта импортов живут в одном файле, и это главное.

  GitHub Pages отдаёт статику с max-age=600, а каждый из модулей кэшируется
  браузером независимо. В окне обновления это собирало смесь старых и новых
  файлов: сигнатуры функций и имена костей между версиями менялись, так что
  смесь не падала с ошибкой, а тихо вела себя неправильно — и приходилось бы
  ловить баги, которых в репозитории нет.

  Здесь у каждого модуля свой versioned URL. Подъём номера меняет их все
  разом, поэтому промежуточного состояния не существует по построению.
  Исходники при этом не трогаются: внутри они импортируют друг друга
  голыми именами tk/*.js, которые разрешает эта карта.

  ПРИ КАЖДОЙ ПРАВКЕ В docs/src ПОДНИМАТЬ НОМЕР:  ./docs/bump-build.sh
-->
<script>window.TK_BUILD = "6";</script>
<script type="importmap">
{
  "imports": {
    "three":              "./vendor/three.module.js?v=6",
    "tk/main.js":         "./src/main.js?v=6",
    "tk/tuning.js":       "./src/tuning.js?v=6",
    "tk/mathx.js":        "./src/mathx.js?v=6",
    "tk/arena.js":        "./src/arena.js?v=6",
    "tk/cameraRig.js":    "./src/cameraRig.js?v=6",
    "tk/fighterRig.js":   "./src/fighterRig.js?v=6",
    "tk/poseDriver.js":   "./src/poseDriver.js?v=6",
    "tk/swingAction.js":  "./src/swingAction.js?v=6",
    "tk/locomotion.js":   "./src/locomotion.js?v=6",
    "tk/ragdoll.js":      "./src/ragdoll.js?v=6",
    "tk/fighter.js":      "./src/fighter.js?v=6",
    "tk/input.js":        "./src/input.js?v=6",
    "tk/ui.js":           "./src/ui.js?v=6"
  }
}
</script>
<script type="module">
  import { start } from 'tk/main.js';
  start().catch(err => {
    document.getElementById('boot').textContent = 'ошибка: ' + (err && err.message ? err.message : err);
    console.error(err);
  });
</script>
</body>
</html>
